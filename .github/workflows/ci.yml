name: ci
# Runs on every pushed work branch and on main. The result is published as a git ref
# (refs/ci/pass/<sha> or refs/ci/fail/<sha>), which the factory reads with only its deploy key.
on:
  push:
    branches: [main, 'task/**', 'plan/**', 'chore/**', 'fix/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
      - if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/verify.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: .factory/logs/

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI attribution in commits
        run: |
          range=HEAD~1..HEAD
          [ "${GITHUB_REF_NAME}" != main ] && range=origin/main..HEAD
          if git log --format=%B "$range" \
              | grep -iqE 'co-authored-by:.*(claude|anthropic)|generated with \[?claude'; then
            echo "::error::Remove AI attribution lines from commit messages"; exit 1
          fi
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report:
    needs: [verify, policy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish result as refs/ci/<result>/<sha>
        run: |
          result=fail
          if [ "${{ needs.verify.result }}" = success ] && [ "${{ needs.policy.result }}" = success ]; then result=pass; fi
          git push origin "${GITHUB_SHA}:refs/ci/${result}/${GITHUB_SHA}"
          echo "CI ${result} for ${GITHUB_SHA}"
