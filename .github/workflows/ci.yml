name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
      - if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/verify.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: .factory/logs/

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI attribution in commits
        run: |
          range=HEAD~1..HEAD
          [ "${{ github.event_name }}" = pull_request ] && range="origin/${{ github.base_ref }}..HEAD"
          if git log --format=%B "$range" \
              | grep -iqE 'co-authored-by:.*(claude|anthropic)|generated with \[?claude'; then
            echo "::error::Remove AI attribution lines from commit messages"; exit 1
          fi
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
