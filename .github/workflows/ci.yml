name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
      - if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/verify.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: .factory/logs/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t polykov:ci .
      - run: docker run -d --name polykov -p 127.0.0.1:7700:7700 polykov:ci
      - name: Wait for /health ok (30 s)
        run: |
          SECONDS=0
          while [ "$SECONDS" -lt 30 ]; do
            if curl -fsS --max-time 2 http://127.0.0.1:7700/health | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo "health ok after ${SECONDS}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::/health not ok after 30 s"; docker logs polykov; exit 1

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI attribution in commits
        run: |
          range=HEAD~1..HEAD
          [ "${{ github.event_name }}" = pull_request ] && range="origin/${{ github.base_ref }}..HEAD"
          if git log --format=%B "$range" \
              | grep -iqE 'co-authored-by:.*(claude|anthropic)|generated with \[?claude'; then
            echo "::error::Remove AI attribution lines from commit messages"; exit 1
          fi
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
