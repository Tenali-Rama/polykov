name: release
# Runs only when the owner pushes a version tag (e.g. v0.0.1). Version numbering is the owner's call.
# Desktop (Tauri) and Android jobs are added by the tasks that create those apps.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  server-and-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/verify.sh
      - run: cargo build --release --workspace
      - name: Package binaries
        run: |
          mkdir -p dist
          for b in polykov polykov-server; do
            [ -f "target/release/$b" ] && tar -czf "dist/$b-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C target/release "$b"
          done
          ls dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    needs: server-and-cli
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "dockerfile=$([ -f Dockerfile ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.dockerfile == 'yes'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.has.outputs.dockerfile == 'yes'
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/tenali-rama/polykov:${{ github.ref_name }}
            ghcr.io/tenali-rama/polykov:latest
